<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kinderdag Paardenrace</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --gras:#2f8f3a; --gras2:#3aa046; --zand:#e9d9b0; --tekst:#111; --wit:#fff;
  --rand:#d0d0d0; --accent:#0b5cad; --rood:#c62828; --groen:#1b7f2a; --goud:#f2b600;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Verdana,Arial,sans-serif;color:var(--tekst);background:#f4f4f4}
button{font-family:inherit;cursor:pointer}
.verborgen{display:none!important}
.knop{border:0;border-radius:10px;padding:14px 18px;font-size:17px;font-weight:bold;background:var(--accent);color:#fff}
.knop.grijs{background:#666}.knop.rood{background:var(--rood)}.knop.groen{background:var(--groen)}
.knop:disabled{opacity:.4}
input,select{font-family:inherit;font-size:16px;padding:8px;border:2px solid var(--rand);border-radius:8px}
.demo-balk{position:fixed;bottom:0;left:0;right:0;background:#ffeb3b;font-size:12px;padding:4px 8px;text-align:center;z-index:99}

/* ---------- Startpagina ---------- */
#start{max-width:480px;margin:40px auto;padding:16px;display:flex;flex-direction:column;gap:14px}
#start h1{font-size:24px}

/* ---------- Groot scherm ---------- */
#scherm{height:100vh;display:flex;flex-direction:column;background:#fff;overflow:hidden;padding:1vh 1.2vw}
.s-kop{display:flex;justify-content:space-between;align-items:center;height:7vh}
.s-kop h1{margin:0;font-size:4.2vh;font-weight:900}
.s-bevroren{background:var(--rood);color:#fff;font-weight:900;font-size:2.6vh;padding:.6vh 1.2vw;border-radius:1vh}
.race{display:flex;flex-direction:column;margin-top:1vh;min-height:0}
.race-kop{display:flex;justify-content:space-between;font-size:2.8vh;font-weight:900;padding:.3vh 0}
.banen{flex:1;display:flex;flex-direction:column;border:.4vh solid #111;border-radius:1vh;overflow:hidden;min-height:0}
.baan{flex:1;display:flex;align-items:stretch;min-height:0;border-bottom:.25vh dashed rgba(255,255,255,.7)}
.baan:last-child{border-bottom:0}
.baan:nth-child(odd) .spoor{background:var(--gras)}
.baan:nth-child(even) .spoor{background:var(--gras2)}
.b-naam{width:17vw;display:flex;align-items:center;gap:.8vw;padding:0 .8vw;background:#fff;border-right:.4vh solid #111;font-weight:900;font-size:2.6vh;white-space:nowrap;overflow:hidden}
.b-kleur{width:3.2vh;height:3.2vh;border-radius:50%;border:.3vh solid #111;flex:none}
.spoor{flex:1;position:relative}
.finish{position:absolute;right:0;top:0;bottom:0;width:1.6vw;
  background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/1.6vw 1.6vw}
.paard{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--p,0) * (100% - 7.5vw));
  transition:left 2.6s cubic-bezier(.3,.1,.3,1);display:flex;align-items:center}
.ruiter{font-size:min(6.5vh,5vw);line-height:1;display:inline-block;transform:scaleX(-1);
  animation:draf .9s ease-in-out infinite;animation-delay:var(--d,0s)}
.paard.rent .ruiter{animation:galop .28s ease-in-out infinite}
.stof{position:absolute;left:-2.2vw;bottom:-.4vh;width:2.4vw;height:2vh;opacity:0;pointer-events:none}
.stof i{position:absolute;bottom:0;width:1vh;height:1vh;border-radius:50%;background:rgba(233,217,176,.9)}
.paard.rent .stof{opacity:1}
.paard.rent .stof i{animation:stof .6s linear infinite}
.paard.rent .stof i:nth-child(2){animation-delay:.2s;left:.8vw}
.paard.rent .stof i:nth-child(3){animation-delay:.4s;left:1.6vw}
@keyframes draf{0%,100%{transform:scaleX(-1) translateY(0) rotate(0)}25%{transform:scaleX(-1) translateY(-.35vh) rotate(-2deg)}50%{transform:scaleX(-1) translateY(0) rotate(0)}75%{transform:scaleX(-1) translateY(-.2vh) rotate(1.5deg)}}
@keyframes galop{0%,100%{transform:scaleX(-1) translateY(0) rotate(2deg)}50%{transform:scaleX(-1) translateY(-1.1vh) rotate(-6deg)}}
@keyframes stof{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(-1.6vw,-1.4vh) scale(1.8);opacity:0}}
.nr{position:absolute;left:38%;top:44%;min-width:2.6vh;height:2.6vh;padding:0 .3vh;border-radius:.6vh;border:.25vh solid #111;
  font-size:1.7vh;font-weight:900;display:flex;align-items:center;justify-content:center;background:#fff}
.b-score{width:12vw;display:flex;align-items:center;justify-content:flex-end;gap:1vw;padding:0 .8vw;background:#fff;border-left:.4vh solid #111;font-weight:900}
.b-punten{font-size:3.2vh}
.b-plek{font-size:2.4vh;min-width:4.2vh;height:4.2vh;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center}
.b-plek.p1{background:var(--goud)}
#toasts{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);display:flex;flex-direction:column;gap:1vh;align-items:center;pointer-events:none}
.toast{background:#111;color:#fff;font-weight:900;font-size:3.4vh;padding:1.2vh 2.4vw;border-radius:1.4vh;box-shadow:0 .6vh 2vh rgba(0,0,0,.35);
  animation:inuit 4.5s forwards}
@keyframes inuit{0%{opacity:0;transform:translateY(3vh)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#winnaar{position:fixed;inset:0;background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;text-align:center}
#winnaar h2{font-size:7vh;margin:0}
.w-blok{font-size:4.5vh;font-weight:900}
.w-blok .w-cat{font-size:3vh;color:#444;display:block}


/* ---------- Route ---------- */
.r-wrap{flex:1;display:flex;gap:1vw;min-height:0;margin-top:1vh}
.r-kaart{height:100%;flex:none;border:.4vh solid #111;border-radius:1vh;overflow:hidden;background:#cfe6f5}
.r-kaart svg.r-svg{height:100%;width:auto;display:block}
.r-stand{flex:1;display:flex;flex-direction:column;gap:1.4vh;min-width:22vw}
.r-cat h2{margin:0 0 .6vh;font-size:3.2vh;font-weight:900}
.r-rij{display:flex;align-items:center;gap:.7vw;background:#f1f1f1;border-radius:1vh;padding:0 .8vw;margin-bottom:.5vh;height:5.7vh}
.r-pion{width:4.4vh;height:4.4vh;flex:none;border-radius:50%;border:.3vh solid #111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:2.3vh}
.r-pion.jong{border-radius:.7vh}
.r-naam{flex:1;min-width:0;font-weight:900;font-size:2.7vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.r-naam small{display:block;font-size:2vh;font-weight:bold;color:#444}
.r-pt{font-weight:900;font-size:3.6vh}
.pion .pb{transform-box:fill-box;transform-origin:center}
.pion.loopt .pb{animation:hop .3s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-7px)}}

/* ---------- Postleider ---------- */
#post{max-width:520px;margin:0 auto;padding:14px 14px 60px}
.p-kop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-kop h2{margin:6px 0;font-size:22px}
.verb{font-size:13px;font-weight:bold}
.verb.aan{color:var(--groen)}.verb.uit{color:var(--rood)}
.uitleg{background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.groep-raster{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.g-knop{border:3px solid #111;border-radius:12px;padding:10px 4px;background:#fff;font-size:18px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px}
.g-knop .kl{width:22px;height:22px;border-radius:50%;border:2px solid #111}
.g-knop .gd{font-size:11px;font-weight:normal}
.g-knop.gedaan{background:#e7f5e9}
.g-knop.gekozen{outline:5px solid var(--accent)}
.sub{font-size:13px;font-weight:bold;margin-top:10px;color:#444}
.invoer{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.groot{font-size:34px;text-align:center;width:100%;font-weight:bold}
.rij{display:flex;gap:8px;align-items:center}
.rij > *{flex:1}
.stopwatch{font-size:46px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.voorbeeld{text-align:center;font-size:18px;font-weight:bold}
.melding{padding:10px;border-radius:8px;font-weight:bold;text-align:center}
.melding.ok{background:#e7f5e9;color:var(--groen)}
.melding.fout{background:#fdecea;color:var(--rood)}

/* ---------- Beheer ---------- */
#beheer{max-width:1100px;margin:0 auto;padding:14px 14px 60px}
#beheer section{background:#fff;border-radius:10px;padding:12px 14px;margin:12px 0}
#beheer h3{margin:0 0 10px}
.knoppen{display:flex;flex-wrap:wrap;gap:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #e3e3e3;padding:5px;text-align:left}
td input,td select{font-size:14px;padding:5px;width:100%}
.matrix td,.matrix th{text-align:center}
.matrix td.cel{cursor:pointer}
.matrix td.cel:hover{background:#eef4fb}
.klein{font-size:12px;color:#555}
code{background:#eee;padding:2px 5px;border-radius:4px;word-break:break-all}
</style>
</head>

    };

  const KEY = 'kinderdag-demo';
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(KEY) : null;
  const abonnees = [];
  const lees = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  const meld = () => { const d = lees(); abonnees.forEach(f => f(d)); };
  const schrijf = t => { localStorage.setItem(KEY, JSON.stringify(t)); if (bc) bc.postMessage(1); meld(); };
  window.addEventListener('storage', e => { if (e.key === KEY) meld(); });
  if (bc) bc.onmessage = meld;

    const p = pad.split('/'); let o = t;
    for (let i = 0; i < p.length - 1; i++){ if (typeof o[p[i]] !== 'object' || o[p[i]] === null) o[p[i]] = {}; o = o[p[i]]; }

  }
  return {
    modus:'demo',
    volg(cb){ abonnees.push(cb); cb(lees()); },
    zet(pad, w){ const t = lees(); zetPad(t, pad, w); schrijf(t); return Promise.resolve(); },
    meerdere(obj){ const t = lees(); for (const k in obj) zetPad(t, k, obj[k]); schrijf(t); return Promise.resolve(); },

  if (typeof a !== 'object' || a === null || typeof b !== 'object') return b;

}

  s = String(s ?? '').trim().replace(',', '.'); if (!s) return NaN;

  return parseFloat(s);
}
function fmtTijd(sec){
  if (!isFinite(sec)) return '';

}

  if (!isFinite(w)) return 0;
  if (post.type === 'punten') return Math.max(0, Math.min(max, w));
  const b = Number(post.beste), s = Number(post.slechtste);

  const f = (w - s) / (b - s);

}

function locatieTekst(sv){
  if (sv >= LAATSTE - 0.001) return 'in Brunstad';
  const k = Math.floor(sv + 0.001);
  if (sv - k < 0.02) return k === 0 ? 'bij de start' : 'in ' + stopNaam(k);
  return '\u2192 ' + stopNaam(k + 1);
}
const lichteKleur = k => ['#ffffff','#ffe119','#42d4f4','#aaffc3'].includes(String(k).toLowerCase());

function svgLijnen(m, alleenInzet){
  const R = routeData(); let out = '', sym = '';
  for (let j = 1; j < R.pts.length; j++){
    const p = R.pts[j-1], q = R.pts[j], e = q.e || 'land';
    if (alleenInzet && !(inInzet(p.la, p.lo) || inInzet(q.la, q.lo))) continue;
    const [x1,y1] = proj(m, p.la, p.lo), [x2,y2] = proj(m, q.la, q.lo);

                : e === 'brug' ? 'stroke="#444" stroke-width="7"'
                : 'stroke="#c62828" stroke-width="5" stroke-dasharray="12 7"';
    out += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" '+stijl+'/>';
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    if (e === 'pont') sym += '<g transform="translate('+(mx+34).toFixed(0)+','+(my-8).toFixed(0)+')"><rect x="-26" y="-22" width="52" height="40" rx="8" fill="#fff" stroke="#0b5cad" stroke-width="2"/>' +
      '<path d="M-18,2 L18,2 L13,11 L-13,11Z" fill="#0b5cad"/><rect x="-9" y="-8" width="16" height="10" fill="#fff" stroke="#0b5cad" stroke-width="2"/><rect x="2" y="-14" width="4" height="7" fill="#c62828"/>' +
      '<path d="M-20,14 q5,-3 10,0 t10,0 t10,0 t10,0" fill="none" stroke="#0b5cad" stroke-width="2"/></g>';
    if (e === 'brug') sym += '<g transform="translate('+(mx+30).toFixed(0)+','+(my+6).toFixed(0)+')"><rect x="-28" y="-20" width="56" height="38" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>' +
      '<path d="M-20,2 L20,2" stroke="#444" stroke-width="4"/><path d="M-20,2 Q-10,-14 0,2 Q10,-14 20,2" fill="none" stroke="#444" stroke-width="3"/>' +
      '<path d="M-10,2 L-10,12 M10,2 L10,12 M0,2 L0,12" stroke="#444" stroke-width="3"/><path d="M-22,13 q5,-3 11,0 t11,0 t11,0 t11,0" fill="none" stroke="#0b5cad" stroke-width="2"/></g>';
  }
  return out + sym;
}
function svgStops(m, inzet, fs){
  const R = routeData(); let out = '';
  for (let k = 0; k <= LAATSTE; k++){
    const p = R.pts[R.stopNode[k]];
    if (inInzet(p.la, p.lo) !== inzet) continue;
    const [x,y] = proj(m, p.la, p.lo), fin = k === LAATSTE, start = k === 0;
    const tekst = start ? 'Start' : fin ? p.n : k + '. ' + p.n;
    let tx = x + 14, ty = y + fs*0.35, anc = 'start';
    if (p.lab === 'l'){ tx = x - 14; anc = 'end'; }
    if (p.lab === 'o'){ tx = x; ty = y + fs + 12; anc = 'middle'; }
    if (p.lab === 'b'){ tx = x; ty = y - 16; anc = 'middle'; }
    out += fin
      ? '<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')"><path d="M0,0 L0,-34" stroke="#111" stroke-width="3"/><path d="M0,-34 L24,-27 L0,-20Z" fill="#c62828"/><circle r="11" fill="#c62828" stroke="#fff" stroke-width="3"/></g>'
      : '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(start ? 11 : 8)+'" fill="#111" stroke="#fff" stroke-width="3"/>';
    out += '<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="'+anc+'" font-size="'+fs+'" font-weight="900" font-family="Verdana" fill="#111" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">'+esc(tekst)+'</text>';
  }
  return out;
}
function bouwRoute(){

  return '<div class="r-wrap">' +

      '<text x="'+((fx0+fx1)/2).toFixed(1)+'" y="'+(fy1+34).toFixed(1)+'" text-anchor="middle" font-size="26" font-weight="900" font-family="Verdana" fill="#111" stroke="#fff" stroke-width="5" paint-order="stroke">zie Noorwegen &#8594;</text>' +

    '<div class="r-kaart"><svg class="r-svg" viewBox="0 0 '+z.W+' '+z.H+'" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="'+z.W+'" height="'+z.H+'" fill="#cfe6f5"/><path d="'+z.land+'" fill="#f3efe2" stroke="#9a9a9a" stroke-width="1"/>' +
      svgLijnen(z, true) + svgStops(z, true, 22) +
      '<text x="14" y="'+(z.H-18)+'" font-size="30" font-weight="900" font-family="Verdana" fill="#111" stroke="#fff" stroke-width="5" paint-order="stroke">Noorwegen</text>' +
      '<g id="pl-inzet"></g></svg></div>' +
    '<div class="r-stand" id="r-stand"></div></div>';
}
const toonS = {}, doelS = {}; let animLoopt = false;
function plaatsPion(g, sv){
  const el = document.getElementById('pi-' + g); if (!el) return;
  const pt = puntOpRoute(sv), inz = inInzet(pt.la, pt.lo);
  const laag = document.getElementById(inz ? 'pl-inzet' : 'pl-main');
  if (el.parentNode !== laag) laag.appendChild(el);
  const [x, y] = proj(inz ? KAART.inzet : KAART.main, pt.la, pt.lo);
  const hoek = (nrVan(g) - 1) / 12 * Math.PI * 2, r = 30;
  const sc = inz ? 0.72 : 1;
  el.setAttribute('transform', 'translate(' + (x + Math.cos(hoek)*r*sc).toFixed(1) + ',' + (y + Math.sin(hoek)*r*sc).toFixed(1) + ') scale(' + sc + ')');
}
function animeer(){
  if (animLoopt) return; animLoopt = true;
  let vorige = performance.now();
  const stap = t => {
    const dt = Math.min(100, t - vorige); vorige = t;
    for (const g in doelS){
      const el = document.getElementById('pi-' + g); if (!el) continue;
      const cur = toonS[g] ?? 0, diff = doelS[g] - cur;
      if (Math.abs(diff) > 0.0005){
        let nw = cur + diff * Math.min(1, dt / 650);
        if (Math.abs(doelS[g] - nw) < 0.002) nw = doelS[g];
        toonS[g] = nw; plaatsPion(g, nw); el.classList.add('loopt');
      } else el.classList.remove('loopt');
    }
    requestAnimationFrame(stap);
  };
  requestAnimationFrame(stap);
}
function updateRoute(cats, tot){
  let html = '';
  for (const c of cats){
    const rp = Number(D.instellingen[c.id === 'jong' ? 'routeJong' : 'routeOuder']) || 1;
    const gs = sorteer(D.groepen).filter(g => D.groepen[g].cat === c.id);
    const rang = gs.slice().sort((a,b) => tot[b] - tot[a]);
    html += '<div class="r-cat"><h2>' + c.titel + '</h2>';
    for (const g of rang){
      const gr = D.groepen[g], sv = Math.min(LAATSTE, tot[g] / rp * LAATSTE);
      doelS[g] = sv;
      const plek = tot[g] > 0 ? rang.findIndex(x => tot[x] === tot[g]) + 1 : '-';
      html += '<div class="r-rij"><span class="b-plek' + (tot[g] > 0 && tot[rang[0]] === tot[g] ? ' p1' : '') + '">' + plek + '</span>' +
        '<span class="r-pion' + (c.id === 'jong' ? ' jong' : '') + '" style="background:' + esc(gr.kleur) + ';color:' + (lichteKleur(gr.kleur) ? '#111' : '#fff') + '">' + nrVan(g) + '</span>' +
        '<span class="r-naam">' + esc(gr.naam) + '<small>' + esc(locatieTekst(sv)) + '</small></span><span class="r-pt">' + num(tot[g]) + '</span></div>';
    }
    html += '</div>';
  }
  $('#r-stand').innerHTML = html;
  for (const g of sorteer(D.groepen)) plaatsPion(g, toonS[g] ?? 0);
  animeer();
}
function bouwRace(cats){
  return cats.map(c => {
    const gs = sorteer(D.groepen).filter(g => D.groepen[g].cat === c.id);
    return '<div class="race" style="flex:' + Math.max(gs.length,1) + '"><div class="race-kop"><span>' + c.titel + '</span><span id="s-max-' + c.id + '"></span></div><div class="banen">' +
      gs.map(g => '<div class="baan" id="b-' + g + '"><div class="b-naam"><span class="b-kleur"></span><span class="b-tekst"></span></div>' +
        '<div class="spoor"><div class="finish"></div><div class="paard" style="--d:-' + ((nrVan(g) * 0.37) % 0.9).toFixed(2) + 's"><span class="stof"><i></i><i></i><i></i></span><span class="ruiter">\u{1F3C7}</span><span class="nr"></span></div></div>' +
        '<div class="b-score"><span class="b-punten">0</span><span class="b-plek"></span></div></div>').join('') +
      '</div></div>';
  }).join('');
}
function updateRace(cats, tot){
  const max = Number(D.instellingen.maxPerPost) || 10;
  for (const c of cats){
    const maxTot = c.posten * max;
    $('#s-max-' + c.id).textContent = 'finish = ' + maxTot + ' punten';
    const gs = sorteer(D.groepen).filter(g => D.groepen[g].cat === c.id);
    const rang = gs.slice().sort((a,b) => tot[b] - tot[a]);
    for (const g of gs){
      const el = $('#b-' + g); if (!el) continue;
      const gr = D.groepen[g];
      el.querySelector('.b-kleur').style.background = gr.kleur;
      el.querySelector('.b-tekst').textContent = gr.naam;
      const nr = el.querySelector('.nr'); nr.textContent = nrVan(g); nr.style.background = gr.kleur;
      nr.style.color = lichteKleur(gr.kleur) ? '#111' : '#fff';
      const p = Math.min(1, maxTot ? tot[g] / maxTot : 0);
      const paard = el.querySelector('.paard');
      if (paard.dataset.p !== String(p)){
        paard.dataset.p = String(p); paard.style.setProperty('--p', p);
        paard.classList.add('rent'); clearTimeout(paard._t); paard._t = setTimeout(() => paard.classList.remove('rent'), 2600);
      }
      el.querySelector('.b-punten').textContent = num(tot[g]);
      const pe = el.querySelector('.b-plek');
      pe.textContent = tot[g] > 0 ? (rang.findIndex(x => tot[x] === tot[g]) + 1) : '-';
      pe.classList.toggle('p1', tot[g] > 0 && tot[rang[0]] === tot[g]);
    }
  }
}

const gezien = new Map(); let toastStart = false;
function renderScherm(){
  const root = $('#scherm');
  const scores = (D.status.bevroren && D.status.snapshot) ? D.status.snapshot : D.scores;
  const tot = totalen(D, scores);
  const max = Number(D.instellingen.maxPerPost) || 10;
  const cats = [
    { id:'ouder', titel:'Oudere groepen', posten:Number(D.instellingen.postenOuder) || 12 },
    { id:'jong',  titel:'Jonge groepen',  posten:Number(D.instellingen.postenJong)  || 7 }
  ];
  const modus = D.instellingen.weergave === 'race' ? 'race' : 'route';
  const signatuur = modus + JSON.stringify(sorteer(D.groepen).map(g => [g, D.groepen[g].cat, D.groepen[g].kleur]));
  if (root.dataset.sig !== signatuur){
    root.dataset.sig = signatuur;
    root.innerHTML = '<div class="s-kop"><h1 id="s-titel"></h1><div id="s-bev" class="s-bevroren verborgen">STAND BEVROREN</div></div>' +
      (modus === 'race' ? bouwRace(cats) : bouwRoute()) +
      '<div id="toasts"></div><div id="winnaar" class="verborgen"></div>';
  }
  $('#s-titel').textContent = D.instellingen.titel;
  $('#s-bev').classList.toggle('verborgen', !D.status.bevroren);
  if (modus === 'race') updateRace(cats, tot); else updateRoute(cats, tot);
  const winnaars = cats.map(c => {
    const gs = sorteer(D.groepen).filter(g => D.groepen[g].cat === c.id).sort((a,b) => tot[b] - tot[a]);
    return { c, g: gs[0] };
  });
  // Meldingen bij nieuwe scores
  const live = D.scores || {};
  for (const p in live) for (const g in live[p]){
    const k = p + '/' + g, t = live[p][g].t;
    if (gezien.get(k) !== t){
      if (toastStart && !D.status.bevroren && D.posten[p] && D.groepen[g]){
        const pt = punten(D.posten[p], Number(live[p][g].w), max);
        toast(D.groepen[g].naam + '  +' + num(pt) + '  bij ' + D.posten[p].naam);
      }
      gezien.set(k, t);
    }
  }
  toastStart = true;
  const w = $('#winnaar');
  if (D.status.winnaar && !D.status.bevroren){
    w.innerHTML = '<h2>Winnaars</h2>' + winnaars.filter(x => x.g).map(x =>
      '<div class="w-blok"><span class="w-cat">' + x.c.titel + '</span>' + esc(D.groepen[x.g].naam) + ' &ndash; ' + num(tot[x.g]) + ' punten</div>').join('');
    w.classList.remove('verborgen');
  } else w.classList.add('verborgen');
}
function toast(tekst){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = tekst;
  const box = $('#toasts'); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 4600);
}

const P = { post: localStorage.getItem('kd-post') || '', groep:'', melding:null, sw:{ loopt:false, start:0, verstreken:0, timer:null }, verbonden:true };
function renderPost(){
  const root = $('#post');
  const max = Number(D.instellingen.maxPerPost) || 10;
  if (!P.post || !D.posten[P.post]){
    root.innerHTML = '<h2>Postleider</h2><div class="invoer"><label>Pincode van je post</label>' +
      '<input id="pin" class="groot" inputmode="numeric" autocomplete="off"><button class="knop" id="login">Inloggen</button>' +
      (P.melding ? '<div class="melding fout">' + esc(P.melding) + '</div>' : '') + '</div>';
    $('#login').onclick = () => {
      const pin = $('#pin').value.trim();
      const p = sorteer(D.posten).find(k => String(D.posten[k].pin) === pin && D.posten[k].actief !== false);
      if (p){ P.post = p; localStorage.setItem('kd-post', p); P.melding = null; } else P.melding = 'Onbekende pincode.';
      renderPost();
    };
    $('#pin').onkeydown = e => { if (e.key === 'Enter') $('#login').click(); };
    return;
  }
  // Bij live updates het invoerveld niet overschrijven tijdens typen

  P._ingelogd = P.post;
  const post = D.posten[P.post];
  root.innerHTML =
    '<div class="p-kop"><h2>' + esc(post.naam) + '</h2><button class="knop grijs" id="uit" style="padding:8px 12px;font-size:14px">Uitloggen</button></div>' +
    '<div class="verb ' + (P.verbonden ? 'aan">Verbonden' : 'uit">Geen verbinding - scores worden later verstuurd') + '</div>' +
    '<div class="uitleg">' + esc(uitleg(post, max)) + '</div>' +

function werkGroepenBij(){

function renderInvoer(){

  if (!P.groep){ box.innerHTML = P.melding ? '<div class="melding ' + P.melding.soort + '">' + esc(P.melding.tekst) + '</div>' : '<div class="uitleg">Kies een groep.</div>'; return; }
  const post = D.posten[P.post], gr = D.groepen[P.groep];
  const bestaand = ((D.scores || {})[P.post] || {})[P.groep];
  let veld;
  if (post.type === 'tijd'){
    veld = '<div class="stopwatch" id="sw">0:00,0</div><div class="rij"><button class="knop groen" id="sw-start">Start</button><button class="knop rood" id="sw-stop">Stop</button><button class="knop grijs" id="sw-reset">Reset</button></div>' +
      '<label>Tijd (min:sec)</label><input id="waarde" class="groot" inputmode="decimal" placeholder="1:23" value="' + (bestaand ? esc(fmtTijd(Number(bestaand.w))) : '') + '">';

      '<div class="rij"><button class="knop grijs" id="min" style="flex:0 0 64px">-1</button><input id="waarde" class="groot" inputmode="decimal" value="' + (bestaand ? esc(num(Number(bestaand.w))) : '') + '"><button class="knop grijs" id="plus" style="flex:0 0 64px">+1</button></div>';
  }

  inp.oninput = toon; toon();
  if ($('#min')){

    $('#sw-reset').onclick = () => stopSw(true);
    $('#sw').textContent = fmtTijd(P.sw.verstreken/1000);
  }
  $('#opslaan').onclick = () => {

    opslag.zet('scores/' + P.post + '/' + P.groep, { w, t: Date.now() });
    P.melding = { soort:'ok', tekst: gr.naam + ': ' + fmtWaarde(post, w) + ' opgeslagen (' + num(punten(post, w, max)) + ' punten).' };

    document.activeElement && document.activeElement.blur();
    werkGroepenBij(); renderInvoer();
  };
}
function stopSw(reset){
  clearInterval(P.sw.timer); P.sw.loopt = false;

  const root = $('#beheer');
  if (!beheerIn){
    root.innerHTML = '<h2>Beheer</h2><section><label>Beheerpincode</label><div class="rij"><input id="bpin" inputmode="numeric"><button class="knop" id="blogin">Inloggen</button></div></section>';
    $('#blogin').onclick = () => { if ($('#bpin').value.trim() === String(D.instellingen.beheerPin)){ beheerIn = true; sessionStorage.setItem('kd-beheer','1'); renderBeheer(); } else alert('Onjuiste pincode.'); };
    return;
  }
  if (!beheerOpgebouwd){ bouwBeheer(); beheerOpgebouwd = true; }
  renderStatus(); renderMatrix();
}
function bouwBeheer(){
  const root = $('#beheer'), I = D.instellingen;
  const basis = location.href.split('#')[0];
  root.innerHTML =
    '<h2>Beheer</h2>' +
    '<section><h3>Wedstrijd</h3><div id="statusregel" class="klein" style="margin-bottom:8px"></div><div class="knoppen">' +
      '<button class="knop" id="bevries">Stand bevriezen</button><button class="knop groen" id="ontknoping">Ontknoping</button>' +
      '<button class="knop" id="toonwin">Winnaar tonen/verbergen</button><button class="knop grijs" id="test">Testscores vullen</button>' +
      '<button class="knop rood" id="wisscores">Alle scores wissen</button><button class="knop rood" id="reset">Alles resetten</button></div></section>' +
    '<section><h3>Scores</h3><div class="klein">Klik op een vakje om te wijzigen of te wissen.</div><div id="matrix" style="overflow-x:auto"></div></section>' +
    '<section><h3>Instellingen</h3><table><tr><th>Titel</th><th>Posten jong</th><th>Posten ouder</th><th>Max. punten per post</th><th>Beheerpincode</th><th>Weergave scherm</th><th>Route ouder (punten tot Brunstad)</th><th>Route jong (punten tot Brunstad)</th></tr><tr>' +
      '<td><input data-i="titel" value="' + esc(I.titel) + '"></td><td><input data-i="postenJong" type="number" value="' + esc(I.postenJong) + '"></td>' +
      '<td><input data-i="postenOuder" type="number" value="' + esc(I.postenOuder) + '"></td><td><input data-i="maxPerPost" type="number" value="' + esc(I.maxPerPost) + '"></td>' +
      '<td><input data-i="beheerPin" value="' + esc(I.beheerPin) + '"></td>' +
      '<td><select data-i="weergave"><option value="route"' + (I.weergave !== 'race' ? ' selected' : '') + '>Route naar Brunstad</option><option value="race"' + (I.weergave === 'race' ? ' selected' : '') + '>Paardenrace</option></select></td>' +
      '<td><input data-i="routeOuder" type="number" value="' + esc(I.routeOuder) + '"></td><td><input data-i="routeJong" type="number" value="' + esc(I.routeJong) + '"></td></tr></table></section>' +
    '<section><h3>Posten</h3><div class="klein">Type punten: postleider geeft direct 0 tot max. Aantal/tijd: omgerekend tussen slechtste (0 punten) en beste (max). Tijd invullen als min:sec.</div><table><tr><th>Actief</th><th>Nr</th><th>Naam</th><th>Type</th><th>Beste</th><th>Slechtste</th><th>Pincode</th></tr>' +
      sorteer(D.posten).map(p => { const x = D.posten[p], t = x.type === 'tijd';
        return '<tr><td><input type="checkbox" data-p="' + p + '" data-v="actief"' + (x.actief !== false ? ' checked' : '') + '></td><td>' + nrVan(p) + '</td>' +
          '<td><input data-p="' + p + '" data-v="naam" value="' + esc(x.naam) + '"></td>' +
          '<td><select data-p="' + p + '" data-v="type">' + ['punten','aantal','tijd'].map(o => '<option' + (x.type === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></td>' +
          '<td><input data-p="' + p + '" data-v="beste" value="' + esc(t ? fmtTijd(x.beste) : x.beste) + '"></td>' +
          '<td><input data-p="' + p + '" data-v="slechtste" value="' + esc(t ? fmtTijd(x.slechtste) : x.slechtste) + '"></td>' +
          '<td><input data-p="' + p + '" data-v="pin" value="' + esc(x.pin) + '"></td></tr>'; }).join('') + '</table></section>' +
    '<section><h3>Groepen</h3><table><tr><th>Nr</th><th>Naam</th><th>Categorie</th><th>Kleur</th></tr>' +
      sorteer(D.groepen).map(g => { const x = D.groepen[g];
        return '<tr><td>' + nrVan(g) + '</td><td><input data-g="' + g + '" data-v="naam" value="' + esc(x.naam) + '"></td>' +
          '<td><select data-g="' + g + '" data-v="cat"><option' + (x.cat === 'jong' ? ' selected' : '') + '>jong</option><option' + (x.cat === 'ouder' ? ' selected' : '') + '>ouder</option></select></td>' +
          '<td><input type="color" data-g="' + g + '" data-v="kleur" value="' + esc(x.kleur) + '" style="padding:0;height:34px"></td></tr>'; }).join('') + '</table></section>' +
    '<section><h3>Links</h3><div class="klein">Groot scherm: <code>' + esc(basis) + '#scherm</code><br>Postleiders: <code>' + esc(basis) + '#post</code></div></section>';

  root.querySelectorAll('[data-i]').forEach(e => e.onchange = () => {
    const k = e.dataset.i, v = ['postenJong','postenOuder','maxPerPost','routeOuder','routeJong'].includes(k) ? Number(e.value) : e.value.trim();
    opslag.zet('instellingen/' + k, v);
  });
  root.querySelectorAll('[data-p]').forEach(e => e.onchange = () => {
    const p = e.dataset.p, k = e.dataset.v; let v;
    if (k === 'actief') v = e.checked;
    else if (k === 'beste' || k === 'slechtste') v = D.posten[p].type === 'tijd' ? parseTijd(e.value) : parseFloat(e.value.replace(',', '.'));
    else v = e.value.trim();
    if ((k === 'beste' || k === 'slechtste') && !isFinite(v)){ alert('Ongeldige waarde.'); return; }
    opslag.zet('posten/' + p + '/' + k, v);
    if (k === 'type'){ beheerOpgebouwd = false; setTimeout(renderBeheer, 50); }
  });
  root.querySelectorAll('[data-g]').forEach(e => e.onchange = () => opslag.zet('groepen/' + e.dataset.g + '/' + e.dataset.v, e.value.trim()));

  $('#bevries').onclick = () => opslag.meerdere({ 'status/bevroren': true, 'status/snapshot': D.scores || {}, 'status/winnaar': false });
  $('#ontknoping').onclick = () => opslag.meerdere({ 'status/bevroren': false, 'status/snapshot': null });
  $('#toonwin').onclick = () => opslag.zet('status/winnaar', !D.status.winnaar);
  $('#test').onclick = () => {
    if (!confirm('Bestaande scores worden overschreven met willekeurige testscores. Doorgaan?')) return;
    const max = Number(D.instellingen.maxPerPost) || 10, s = {}, ap = actievePosten(D);
    for (const g of sorteer(D.groepen)){
      const n = D.groepen[g].cat === 'jong' ? D.instellingen.postenJong : D.instellingen.postenOuder;
      ap.slice(0, n).forEach(p => {
        if (Math.random() < .25) return;
        const x = D.posten[p]; let w;
        if (x.type === 'punten') w = Math.round(Math.random() * max);
        else { const lo = Math.min(x.beste, x.slechtste), hi = Math.max(x.beste, x.slechtste); w = Math.round(lo + Math.random() * (hi - lo)); }
        (s[p] = s[p] || {})[g] = { w, t: Date.now() + Math.random() };
      });
    }
    opslag.zet('scores', s);
  };
  $('#wisscores').onclick = () => { if (confirm('Alle scores wissen?')) opslag.meerdere({ scores:null, 'status/snapshot':null, 'status/bevroren':false, 'status/winnaar':false }); };
  $('#reset').onclick = () => { if (confirm('Alles terugzetten naar standaard (posten, groepen, scores, instellingen)?')){ opslag.wisAlles(); beheerOpgebouwd = false; setTimeout(renderBeheer, 100); } };
}
function renderStatus(){
  const e = $('#statusregel'); if (!e) return;
  e.textContent = 'Opslag: ' + (opslag.modus === 'firebase' ? 'Firebase (live)' : 'demomodus') + '  |  Scherm: ' +
    (D.status.bevroren ? 'BEVROREN' : 'live') + (D.status.winnaar ? '  |  winnaar zichtbaar' : '');
}
function renderMatrix(){
  const box = $('#matrix'); if (!box) return;
  const ap = actievePosten(D), max = Number(D.instellingen.maxPerPost) || 10, tot = totalen(D, D.scores);
  let h = '<table class="matrix"><tr><th>Groep</th>' + ap.map(p => '<th title="' + esc(D.posten[p].naam) + '">' + nrVan(p) + '</th>').join('') + '<th>Totaal</th></tr>';
  for (const g of sorteer(D.groepen)){
    h += '<tr><td style="text-align:left">' + esc(D.groepen[g].naam) + ' <span class="klein">(' + D.groepen[g].cat + ')</span></td>';
    for (const p of ap){
      const s = ((D.scores || {})[p] || {})[g];
      h += '<td class="cel" data-p="' + p + '" data-g="' + g + '">' + (s ? num(punten(D.posten[p], Number(s.w), max)) + '<br><span class="klein">' + esc(fmtWaarde(D.posten[p], Number(s.w))) + '</span>' : '<span class="klein">-</span>') + '</td>';
    }
    h += '<td><b>' + num(tot[g]) + '</b></td></tr>';
  }
  box.innerHTML = h + '</table>';
  box.querySelectorAll('.cel').forEach(c => c.onclick = () => {
    const p = c.dataset.p, g = c.dataset.g, post = D.posten[p], s = ((D.scores || {})[p] || {})[g];
    const r = prompt(D.groepen[g].naam + ' - ' + post.naam + ' (' + post.type + ')\nNieuwe waarde' + (post.type === 'tijd' ? ' (min:sec)' : '') + '. Leeg = wissen.', s ? fmtWaarde(post, Number(s.w)) : '');
    if (r === null) return;
    if (r.trim() === ''){ opslag.zet('scores/' + p + '/' + g, null); return; }
    const w = post.type === 'tijd' ? parseTijd(r) : parseFloat(r.replace(',', '.'));
    if (!isFinite(w) || w < 0){ alert('Ongeldige waarde.'); return; }
    opslag.zet('scores/' + p + '/' + g, { w, t: Date.now() });
  });
}

/* =========================================================
   ROUTER
   ========================================================= */
function toonWeergave(){
  weergave = (location.hash || '').replace('#', '') || 'start';
  ['start','scherm','post','beheer'].forEach(id => $('#' + id).classList.toggle('verborgen', id !== weergave));
  if (weergave === 'beheer') beheerOpgebouwd = false;
  render();
}
function render(){
  if (weergave === 'scherm') renderScherm();
  else if (weergave === 'post') renderPost();
  else if (weergave === 'beheer') renderBeheer();
}
window.addEventListener('hashchange', toonWeergave);
if (opslag.modus === 'demo') $('#demo').classList.remove('verborgen');
opslag.verbinding(v => { P.verbonden = v; if (weergave === 'post' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) renderPost(); });
opslag.volg(data => { D = samenvoegen(standaard(), data); render(); });
toonWeergave();
</script>
</body>
</html>
